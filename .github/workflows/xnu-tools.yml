name: XNU generators and ARM64 core objects
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_mig.py'
      - 'tools/fetch_mig.py'
      - 'tools/fetch_xnu.py'
      - 'tools/build_xnu_lab.py'
      - 'tools/xnu_*.py'
      - 'tools/test_pmap_cs_scope.py'
      - 'tools/test_pmap_firmware.py'
      - 'tools/test_task_metadata.py'
      - 'tools/test_ipc_mig_abi.py'
      - 'tools/build_xnu_rpc.py'
      - 'tools/test_xnu_rpc.py'
      - 'tools/test_xnu_kobject_scope.py'
      - 'tools/test_xnu_core_scope.py'
      - 'tools/test_xnu_brk_scope.py'
      - 'tools/test_boot_tree.py'
      - 'tools/test_macho.py'
      - 'tools/test_boot_prepare.py'
      - 'tools/test_xnu_platform.py'
      - 'tools/test_xnu_startup_scope.py'
      - 'tools/test_xnu_ipc_policy_scope.py'
      - 'tools/test_xnu_scheduler_providers.py'
      - 'tools/test_xnu_coalition_bank.py'
      - 'tools/test_string_support.py'
      - 'tools/boot_tree_check.c'
      - 'atlantic-core/**'
      - 'include/atlantic/**'
      - 'tests/c/test_boot_tree.c'
      - 'tools/diagnose_xnu_link.py'
      - 'tests/test_xnu_assym.py'
      - 'xnu-port/**'
      - 'tests/xnu_port/**'
      - 'tools/mig-host/**'
      - 'tests/mig/**'
      - 'dependencies.lock.json'
      - '.github/workflows/xnu-tools.yml'
  pull_request:
    paths:
      - 'tools/build_mig.py'
      - 'tools/fetch_mig.py'
      - 'tools/fetch_xnu.py'
      - 'tools/build_xnu_lab.py'
      - 'tools/xnu_*.py'
      - 'tools/test_pmap_cs_scope.py'
      - 'tools/test_pmap_firmware.py'
      - 'tools/test_task_metadata.py'
      - 'tools/test_ipc_mig_abi.py'
      - 'tools/build_xnu_rpc.py'
      - 'tools/test_xnu_rpc.py'
      - 'tools/test_xnu_kobject_scope.py'
      - 'tools/test_xnu_core_scope.py'
      - 'tools/test_xnu_brk_scope.py'
      - 'tools/test_boot_tree.py'
      - 'tools/test_macho.py'
      - 'tools/test_boot_prepare.py'
      - 'tools/test_xnu_platform.py'
      - 'tools/test_xnu_startup_scope.py'
      - 'tools/test_xnu_ipc_policy_scope.py'
      - 'tools/test_xnu_scheduler_providers.py'
      - 'tools/test_xnu_coalition_bank.py'
      - 'tools/test_string_support.py'
      - 'tools/boot_tree_check.c'
      - 'atlantic-core/**'
      - 'include/atlantic/**'
      - 'tests/c/test_boot_tree.c'
      - 'tools/diagnose_xnu_link.py'
      - 'tests/test_xnu_assym.py'
      - 'xnu-port/**'
      - 'tests/xnu_port/**'
      - 'tools/mig-host/**'
      - 'tests/mig/**'
      - 'dependencies.lock.json'
      - '.github/workflows/xnu-tools.yml'
permissions:
  contents: read
jobs:
  mig:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install host compiler and parser generators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-19 lld-19 llvm-19 libclang-rt-19-dev bison flex git tcsh unifdef perl
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned official Apple sources
        run: |
          python3 tools/fetch_xnu.py
          python3 tools/fetch_mig.py
      - name: Record compiler and generator versions
        run: |
          command -v clang
          clang --version
          llvm-nm --version
      - name: Build MIG and generate ARM64 interfaces (no kernel execution)
        run: python3 tools/build_mig.py
      - name: Test strict target-layout extraction
        run: python3 -m unittest discover -s tests -p test_xnu_assym.py -v
      - name: Compile thirteen real XNU ARM64 units and verify target layouts (no link)
        run: python3 tools/build_xnu_lab.py
      - name: Compile original PE as an isolated standard probe and check its native BSP ABI
        run: python3 tools/test_xnu_platform.py --build work/xnu-lab-builds/*/report.json --output work/pe-platform-tests
      - name: Audit selected bootstrap components and retained native Mach initialization
        run: python3 tools/test_xnu_startup_scope.py --build work/xnu-lab-builds/*/report.json --output work/startup-scope-tests
      - name: Audit native IPC policy and isolated standard object probes
        run: python3 tools/test_xnu_ipc_policy_scope.py --build work/xnu-lab-builds/*/report.json --output work/ipc-policy-scope-tests
      - name: Audit native scheduler provider scopes and target ABI without selecting them
        run: python3 tools/test_xnu_scheduler_providers.py --build work/xnu-lab-builds/*/report.json --output work/scheduler-provider-tests
      - name: Audit MIG installed roles and bank field scopes without selecting native providers
        run: python3 tools/test_xnu_coalition_bank.py --build work/xnu-lab-builds/*/report.json --output work/coalition-bank-tests
      - name: Test original strings and isolated standard native entry points without selecting them in the base
        run: python3 tools/test_string_support.py --sanitize --xnu-build work/xnu-lab-builds/*/report.json --output work/string-support-tests
      - name: Compare original boot-data wire layout with native XNU ARM64 headers
        run: python3 tools/test_boot_tree.py --sanitize --xnu-build work/xnu-lab-builds/*/report.json --output work/boot-tree-tests
      - name: Test static-image plans and compare official Mach-O ARM64 header ABI
        run: python3 tools/test_macho.py --sanitize --xnu-build work/xnu-lab-builds/*/report.json --output work/macho-plan-tests
      - name: Compare all candidate boot_args bytes and native bootstrap geometry without execution
        run: python3 tools/test_boot_prepare.py --sanitize --xnu-build work/xnu-lab-builds/*/report.json --output work/boot-prepare-tests
      - name: Verify actual TrustCache dependency selection, including negative paths
        run: python3 tools/test_pmap_cs_scope.py --build work/xnu-lab-builds/*/report.json
      - name: Reject unsupported Apple trust-cache APIs in firmware headers
        run: python3 tools/test_pmap_firmware.py --build work/xnu-lab-builds/*/report.json
      - name: Compare genuine metadata layouts without claiming task object compilation
        run: python3 tools/test_task_metadata.py --build work/xnu-lab-builds/*/report.json
      - name: Verify genuine generated RPC declarations and negative ABI cases
        run: python3 tools/test_ipc_mig_abi.py --build work/xnu-lab-builds/*/report.json
      - name: Check dispatch feature scope without claiming a compiled kobject
        run: python3 tools/test_xnu_kobject_scope.py --build work/xnu-lab-builds/*/report.json --output work/kobject-scope-tests
      - name: Check native panic preprocessing and complete original printf definitions
        run: python3 tools/test_xnu_core_scope.py --build work/xnu-lab-builds/*/report.json --output work/core-scope-tests
      - name: Check BRK/register encodings without claiming a compiled native SLEH object
        run: python3 tools/test_xnu_brk_scope.py --build work/xnu-lab-builds/*/report.json --output work/brk-scope-tests
      - name: Generate and compile forty-two RPC probes and select native kernel sources
        run: python3 tools/build_xnu_rpc.py --build work/xnu-lab-builds/*/report.json
      - name: Verify generated descriptor ABI without claiming kobject execution
        run: python3 tools/test_xnu_rpc.py --build work/xnu-lab-builds/*/report.json --rpc work/xnu-rpc-builds/*/report.json
      - name: Retain strict static link rejection with native RPC objects
        run: python3 tools/diagnose_xnu_link.py --build work/xnu-lab-builds/*/report.json --rpc work/xnu-rpc-builds/*/report.json
      - name: Retain metadata and unit diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xnu-lab-metadata
          retention-days: 7
          path: |
            work/mig-host/report.json
            work/xnu-lab-builds/*/report.json
            work/xnu-lab-builds/*/config/Makefile
            work/xnu-lab-builds/*/config-*.log
            work/xnu-lab-builds/*/startup.log
            work/xnu-lab-builds/*/sched_prim.log
            work/xnu-lab-builds/*/clock.log
            work/xnu-lab-builds/*/vm_init.log
            work/xnu-lab-builds/*/vm_kern.log
            work/xnu-lab-builds/*/genassym.log
            work/xnu-lab-builds/*/assym-abi.log
            work/xnu-lab-builds/*/reject-assym-offset.log
            work/xnu-lab-builds/*/start.log
            work/xnu-lab-builds/*/cswitch.log
            work/xnu-lab-builds/*/locore.log
            work/xnu-lab-builds/*/machine_routines_asm.log
            work/xnu-lab-builds/*/arm_init.log
            work/xnu-lab-builds/*/arm_vm_init.log
            work/xnu-lab-builds/*/machine_routines.log
            work/xnu-lab-builds/*/ipc_init.log
            work/pmap-cs-scope-tests/report.json
            work/pmap-cs-scope-tests/*.log
            work/pmap-firmware-tests/report.json
            work/pmap-firmware-tests/*.log
            work/task-metadata-tests/report.json
            work/task-metadata-tests/*.log
            work/task-metadata-tests/*.ll
            work/ipc-mig-abi-tests/report.json
            work/ipc-mig-abi-tests/*.log
            work/xnu-rpc-builds/*/report.json
            work/xnu-rpc-builds/*/*.log
            work/xnu-rpc-tests/report.json
            work/xnu-rpc-tests/*.log
            work/xnu-rpc-tests/descriptor_abi.c
            work/kobject-scope-tests/*
            work/core-scope-tests/*
            work/brk-scope-tests/report.json
            work/boot-tree-tests/report.json
            work/macho-plan-tests/report.json
            work/boot-prepare-tests/report.json
            work/boot-prepare-tests/*.log
            work/boot-prepare-tests/candidate-boot-args.bin
            work/macho-plan-tests/*.log
            work/pe-platform-tests/report.json
            work/pe-platform-tests/*.log
            work/startup-scope-tests/report.json
            work/startup-scope-tests/*.log
            work/ipc-policy-scope-tests/report.json
            work/ipc-policy-scope-tests/*.log
            work/scheduler-provider-tests/report.json
            work/scheduler-provider-tests/*.log
            work/coalition-bank-tests/report.json
            work/coalition-bank-tests/*.log
            work/string-support-tests/report.json
            work/string-support-tests/*.log
            work/boot-tree-tests/*.log
            work/brk-scope-tests/*.log
            work/brk-scope-tests/brk.ll
            work/xnu-link-diagnostics/report.json
            work/xnu-link-diagnostics/link.log
