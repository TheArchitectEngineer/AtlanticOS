name: Host policy and ARM64 ABI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install explicit freestanding LLVM and emulation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld llvm qemu-system-arm
      - name: Record available tools
        run: |
          python3 --version
          clang --version
      - name: Run host tests, captures, timer and memory reports
        run: python3 tools/validate.py
      - name: Compile unsupported BSP ABI object only
        run: python3 tools/build_abi.py
      - name: Test original freestanding parser with sanitizers
        run: python3 tools/test_freestanding.py --sanitize
      - name: Test typed boot-data inventory and native tree serialization
        run: python3 tools/test_boot_tree.py --sanitize --output work/boot-tree-tests
      - name: Build original ARM64 entry preflight (no XNU)
        run: python3 tools/build_entry.py
      - name: Execute original entry under QEMU EL1 and EL2 (no XNU)
        run: python3 tools/emulate_entry.py
      - name: Verify EL1 exception vectors after both entry paths (no XNU)
        run: |
          python3 tools/build_entry.py --probe el1-trap --output work/entry-qemu-trap
          python3 tools/emulate_entry.py --build work/entry-qemu-trap
      - name: Validate checked-in evidence hashes
        run: |
          python3 tools/evidence-validator/validate_evidence.py evidence/host/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/arm64/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/device-intake-20261020/adb/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/device-intake-20261020/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/entry-lab-20261020/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/firmware-analysis-20261020/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/mig-host-20261020/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/xnu-lab-20261021/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/entry-el1-20261021/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/xnu-arm64-entry-20261021/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/xnu-bootstrap-20261021/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/clang-layout-20261021/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/xnu-thread-20261021/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/clang-layout-ci-20261021/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/xnu-vm-allocator-20261021/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/xnu-pmap-20261021/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/xnu-task-metadata-20261021/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/xnu-core-closure-20261021/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/clang-layout-ci17-20261021/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/xnu-ipc-20261021/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/xnu-rpc-20261022/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/lld-static-arm64-20261022/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/xnu-static-providers-20261022/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/xnu-core-support-20261022/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/xnu-usage-semantics-20261022/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/clang-layout-ci100-20261023/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/xnu-arm64-exceptions-20261023/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/xnu-boot-providers-20261023/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/boot-data-bridge-20261023/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/xnu-original-pe-20261023/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/xnu-memory-providers-20261024/manifest.json
          python3 tools/evidence-validator/validate_evidence.py evidence/xnu-bootstrap-scope-20261024/manifest.json
