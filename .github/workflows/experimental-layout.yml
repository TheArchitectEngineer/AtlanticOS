name: Experimental layout compiler and XNU core objects
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install explicit Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-19 lld-19 llvm-19 libclang-rt-19-dev cmake ninja-build bison flex git tcsh unifdef perl
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"
      - name: Build pinned LLVM with original API and run its contract fixtures
        run: python3 tools/build_atlantic_clang.py --cache work/clang-layout-ci --jobs 2
      - name: Fetch official XNU and MIG; build genuine host generator
        run: |
          python3 tools/fetch_xnu.py
          python3 tools/fetch_mig.py
          python3 tools/build_mig.py
      - name: Compile one hundred genuine XNU units with explicit provider (no execution)
        run: |
          python3 tools/build_xnu_lab.py --layout-compiler work/clang-layout-ci/build/bin/clang --layout-proof work/clang-layout-ci/tests/report.json
      - name: Verify pmap API rejection, object symbols and actual header dependencies
        run: |
          python3 tools/test_pmap_firmware.py --build work/xnu-lab-builds/*/report.json
          python3 tools/test_pmap_cs_scope.py --build work/xnu-lab-builds/*/report.json
      - name: Compare real Mach and BSD metadata layouts and reject corrupted owner offsets
        run: python3 tools/test_task_metadata.py --build work/xnu-lab-builds/*/report.json
      - name: Verify genuine MIG roles and reject kernel port and server ABI mismatches
        run: python3 tools/test_ipc_mig_abi.py --build work/xnu-lab-builds/*/report.json
      - name: Check native dispatch feature scope and unchanged upstream contexts
        run: python3 tools/test_xnu_kobject_scope.py --build work/xnu-lab-builds/*/report.json --output work/kobject-scope-tests
      - name: Check native panic scope and retained formatting ABI against original definitions
        run: python3 tools/test_xnu_core_scope.py --build work/xnu-lab-builds/*/report.json --output work/core-scope-tests
      - name: Compare native usage metadata and unchanged ARM64 type ABI
        run: python3 tools/test_xnu_usage_semantics.py --build work/xnu-lab-builds/*/report.json --output work/usage-semantics-tests
      - name: Retain unresolved native compilation probes as diagnostics
        run: python3 tools/probe_xnu_core.py --build work/xnu-lab-builds/*/report.json --output work/core-probes
      - name: Generate and compile forty-two native RPC files and check selected IDL scopes
        run: python3 tools/build_xnu_rpc.py --build work/xnu-lab-builds/*/report.json
      - name: Check actual kobject table providers and generated descriptor ABI
        run: python3 tools/test_xnu_rpc.py --build work/xnu-lab-builds/*/report.json --rpc work/xnu-rpc-builds/*/report.json
      - name: Record strict static linker rejection without accepting an image
        run: python3 tools/diagnose_xnu_link.py --build work/xnu-lab-builds/*/report.json --rpc work/xnu-rpc-builds/*/report.json
      - name: Retain commands, checks and diagnostics, including partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experimental-layout-and-xnu-metadata
          retention-days: 7
          path: |
            work/clang-layout-ci/report.json
            work/clang-layout-ci/build/*.log
            work/clang-layout-ci/tests/report.json
            work/clang-layout-ci/tests/*.log
            work/clang-layout-ci/tests/positive.ll
            work/mig-host/report.json
            work/xnu-lab-builds/*/report.json
            work/xnu-lab-builds/*/config/Makefile
            work/xnu-lab-builds/*/*.log
            work/pmap-firmware-tests/report.json
            work/pmap-firmware-tests/*.log
            work/pmap-cs-scope-tests/report.json
            work/pmap-cs-scope-tests/*.log
            work/task-metadata-tests/report.json
            work/task-metadata-tests/*.log
            work/task-metadata-tests/*.ll
            work/ipc-mig-abi-tests/report.json
            work/ipc-mig-abi-tests/*.log
            work/xnu-rpc-builds/*/report.json
            work/xnu-rpc-builds/*/*.log
            work/xnu-rpc-tests/report.json
            work/xnu-rpc-tests/*.log
            work/xnu-rpc-tests/descriptor_abi.c
            work/kobject-scope-tests/*
            work/core-scope-tests/*
            work/usage-semantics-tests/report.json
            work/usage-semantics-tests/*.log
            work/usage-semantics-tests/*.ll
            work/core-probes/report.json
            work/core-probes/*.log
            work/xnu-link-diagnostics/report.json
            work/xnu-link-diagnostics/link.log
